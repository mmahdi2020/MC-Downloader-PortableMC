name: Fabric Server 26.1.2 Packer

on:
  workflow_dispatch:
    inputs:
      zip_password:
        description: 'رمز عبور برای فایل 7z'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download and Setup Fabric Server
        run: |
          mkdir fabric_server && cd fabric_server
          
          # دانلود لانچر طبق داکیومنت فابریک
          curl -OJ https://meta.fabricmc.net/v2/versions/loader/26.1.2/0.19.2/1.1.1/server/jar
          
          # پذیرش EULA
          echo "eula=true" > eula.txt
          
          # اجرای سرور با 2 گیگابایت رم برای تولید فایل‌های اولیه
          # از نام فایل دقیق طبق داکیومنت استفاده شده است
          timeout 20s java -Xmx2G -jar fabric-server-mc.26.1.2-loader.0.19.2-launcher.1.1.1.jar nogui || true

      - name: Create Encrypted Split Archive
        run: |
          # ساخت آرشیو پارت‌بندی شده 85 مگابایتی
          7z a -p"${{ github.event.inputs.zip_password }}" -mhe=on -mx=3 -v85m "fabric_server_26.1.2.7z" "./fabric_server/*"

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p releases
          mv fabric_server_26.1.2.7z.* releases/
          
          git add releases/
          git commit -m "Upload Fabric Server 26.1.2 (Loader 0.19.2)"
          
          # مکانیزم Push با retry برای پایداری بیشتر
          for i in {1..5}; do
            git push origin HEAD && break || sleep 15
          done
